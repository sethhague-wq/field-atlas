es Actually Come From — BCE/CE, World History Encyclopedia"})}),s("li",{children:s("a",{href:"#sec2b",className:"hover:underline",children:"A Walk Through Time: Ancient Calendars — NIST"})}),s("li",{children:s("a",{href:"#sec3a",className:"hover:underline",children:"Dating the Undated — Willard Libby and Radiocarbon Dating — ACS"})}),s("li",{children:s("a",{href:"#sec3b",className:"hover:underline",children:"Carbon-14 Dating, Explained — University of Chicago"})})]})]}),w("li",{className:"pt-2",children:[s("a",{href:"#week2",className:"font-semibold hover:underline",children:"Week 2 — Geography & the Sweep of History"}),w("ol",{className:"ml-5 mt-1.5 space-y-1 list-decimal marker:opacity-50",children:[s("li",{children:s("a",{href:"#sec4a",className:"hover:underline",children:"Every Map Is a Choice — National Geographic Education"})}),s("li",{children:s("a",{href:"#sec4b",className:"hover:underline",children:"Common World Map Shows ‘Distorted View’ of Africa — CBC / Correct the Map"})})]})]}),s("li",{className:"pt-2",children:s("a",{href:"#teacher-note",className:"hover:underline",children:"Teacher Note & Sources Index"})})]})]}),w("div",{id:"week1",className:"break-before",children:[s("div",{className:"text-[11px] tracking-[0.2em] uppercase font-semibold opacity-50 mb-2",children:"Week 1"}),s("h2",{className:"display text-[26px] leading-[1.1] font-semibold mb-8",children:"Historiography & the Timeline"})]}),w("section",{id:"sec1",className:"mb-14 avoid-break",children:[s("h3",{className:"display text-[19px] font-semibold leading-[1.25] mb-1",children:"1. How Historians Tell Sources Apart"}),s("div",{className:"text-[12px] tracking-[0.1em] uppercase opacity-60 mb-6",children:"UNSW Library — Primary and secondary sources"}),w("div",{className:"prose text-[14.8px] leading-[1.72] space-y-4",children:[s("p",{children:"Primary sources provide a first-hand account of an event or time period and are considered to be authoritative. They represent original thinking, reports on discoveries or events, or they can share new information. Often these sources are created at the time the events occurred but they can also include sources that are created later. They are usually the first formal appearance of original research."}),s("p",{children:"Secondary sources involve analysis, synthesis, interpretation, or evaluation of primary sources. They often attempt to describe or explain primary sources."}),s("p",{children:"Scholarly journals, although generally considered to be secondary sources, often contain articles on very specific subjects and may be the primary source of information on new developments."}),s("p",{children:"Primary and secondary categories are often not fixed and depend on the study or research you are undertaking. For example, newspaper editorial/opinion pieces can be both primary and secondary. If exploring how an event affected people at a certain time, this type of source would be considered a primary source. If exploring the event, then the opinion piece would be responding to the event and therefore is considered to be a secondary source."}),w("div",{className:"mt-6",children:[s("p",{className:"font-semibold text-[13.5px] tracking-[0.02em]",children:"Primary sources examples:"}),w("ul",{className:"list-disc ml-5 mt-2 space-y-1 text-[14px]",children:[s("li",{children:"diaries, correspondence, ships' logs"}),s("li",{children:"original documents e.g. birth certificates, trial transcripts"}),s("li",{children:"biographies, autobiographies, manuscripts"}),s("li",{children:"interviews, speeches, oral histories"}),s("li",{children:"case law, legislation, regulations, constitutions"}),s("li",{children:"government documents, statistical data, research reports"}),s("li",{children:"a journal article reporting new research or findings"}),s("li",{children:"creative art works, literature"}),s("li",{children:"newspaper advertisements and reportage and editorial/opinion pieces"})]})]}),w("div",{className:"mt-5",children:[s("p",{className:"font-semibold text-[13.5px]",children:"Secondary sources examples:"}),w("ul",{className:"list-disc ml-5 mt-2 space-y-1 text-[14px]",children:[s("li",{children:"journal articles that comment on or analyse research"}),s("li",{children:"textbooks"}),s("li",{children:"dictionaries and encyclopedias"}),s("li",{children:"books that interpret, analyse"}),s("li",{children:"political commentary"}),s("li",{children:"biographies"}),s("li",{children:"dissertations"}),s("li",{children:"newspaper editorial/opinion pieces"}),s("li",{children:"criticism of literature, art works or music"})]})]})]}),w("div",{className:"mt-8 pt-4 border-t border-black/10 text-[11.5px] leading-[1.6]",children:[w("div",{children:[s("span",{className:"font-semibold",children:"Source Link:"})," ",s("a",{href:"https://www.library.unsw.edu.au/using-the-library/information-resources/primary-and-secondary-sources",target:"_blank",rel:"noopener",className:"underline",children:"Primary and secondary sources — UNSW Library"})]}),s("div",{className:"italic opacity-70 mt-1",children:"Ties to: Primary Source, Secondary Source, Bias"})]})]}),s("hr",{className:"border-black/10 my-10"}),w("section",{id:"sec2a",className:"mb-14",children:[s("h3",{className:"display text-[19px] font-semibold leading-[1.25] mb-1",children:"2. Where Our Dates Actually Come From"}),s("div",{className:"text-[12px] tracking-[0.1em] uppercase opacity-60 mb-6",children:"The Origin & History of the BCE/CE Dating System — World History Encyclopedia"}),w("div",{className:"prose text-[14.8px] leading-[1.72] space-y-4",children:[s("p",{className:"italic",children:"The BCE/CE dating system was first used in the 17th century and has been used since in scholarly publications read by people of all faiths and cultures in an effort to be inclusive. This system is also more accurate in that it makes no claim to date the year of Christ's birth which no one knows."}),s("p",{children:"In recent years, a persistent criticism has been leveled against the use of the BCE/CE system (Before the Common or Current Era/Common or Current Era), rather than BC/AD. There is no biblical authority for BC/AD; it was created over 500 years after the events described in the Christian New Testament and was not accepted usage until after another 500 years had passed. The use of common era in place of A.D. first appears in German in the 17th century CE and in English in the 18th."}),s("h4",{className:"font-semibold mt-6 mb-1 text-[14px] tracking-wide uppercase",children:"History of BC/AD"}),s("p",{children:"The Hebrew calendar, still in use, is based on Anno Mundi (“in the year of the world”) which dates events from the beginning of creation as calculated through scripture. Ancient civilizations such as Mesopotamia and Egypt based their calendars on the reigns of kings or the cycles of seasons. Romans counted years from founding of Rome, by consuls, and by emperors."}),s("p",{children:"Julius Caesar (100–44 BCE) reformed the calendar. Christians used Anno Mundi and Roman calendars early on. In c. 525 CE, a Christian monk named Dionysius Exiguus (c. 470–544 CE) invented Anno Domini (“in the year of our Lord”) to stabilize Easter celebration date. Christians of Alexandria were dating from emperor Diocletian (284 CE) who persecuted Christians. Dionysius wanted eastern and western churches to agree."}),s("h4",{className:"font-semibold mt-6 mb-1 text-[14px] tracking-wide uppercase",children:"BC/AD & Bible: Jesus' Birth"}),s("p",{children:"Only problem: no one knew when Jesus was born. Dionysius never claims he knew. Using gospels is problematic. According to Matthew, Jesus born during reign of Herod the Great, who died in 4 BCE. Matthew also says Herod ordered death of children two years and younger, suggesting birth ~6 BCE. With no year zero, around 7 BCE. Luke says Jesus born during census of Quirinius, governor of Syria, dated about 6 CE. Bible internally inconsistent on year. Biblical inconsistency was not on Dionysius' mind; his job was to make calendar work for pope to harmonize Easter."}),w("p",{children:["BC/AD designations popularized by Bede's ",s("em",{children:"Ecclesiastical History of the English People"})," in 731 CE. Widespread after Charlemagne (800–814 CE) standardized dating. Not universal until 15th century, enabling Gregorian reform in 1582 CE."]}),s("h4",{className:"font-semibold mt-6 mb-1 text-[14px] tracking-wide uppercase",children:"The Common Era"}),w("p",{children:["In 17th century term “vulgar era” appears as replacement for Anno Domini in writings of German astronomer Johannes Kepler (1571–1630). At this time “vulgar” meant “common.” Phrase used interchangeably with “after time of Christ” or “in common era” which became “common era” and CE, giving rise to BCE. First use of “common era” in English dates to 1708 publication ",s("em",{children:"The History of the Works of the Learned"}),"."]}),s("p",{children:"Non-Christian scholars embraced new designations because they could communicate with Christian community while retaining own calendars without compromising beliefs."}),s("h4",{className:"font-semibold mt-6 mb-1 text-[14px] tracking-wide uppercase",children:"BCE/CE in Present Day"}),s("p",{children:"Use is not attempt to remove Jesus from calendar but has historical precedent. BCE/CE continues because more accurate than BC/AD. Dionysius had no concept of zero; year 1 AD follows 1 BC without starting point. BC/AD system assumed someone knew birth date. Dating from uncertain point is inaccurate. Since over 1000 years passed, claim changed to supposed date. Also inclusive: BC/AD subordinates all events to Christian understanding. People of different cultures should be able to discuss history without dating according to Christian belief. World History Encyclopedia uses BCE/CE to be accurate and inclusive."})]}),w("div",{className:"mt-8 pt-4 border-t border-black/10 text-[11.5px] leading-[1.6]",children:[w("div",{children:[s("span",{className:"font-semibold",children:"Source Link:"})," ",s("a",{href:"https://www.worldhistory.org/article/1041/the-origin--history-of-the-bcece-dating-system/",target:"_blank",rel:"noopener",className:"underline",children:"The Origin & History of the BCE/CE Dating System — World History Encyclopedia"})]}),s("div",{className:"italic opacity-70 mt-1",children:"Ties to: Chronology, Historiography"})]})]}),w("section",{id:"sec2b",className:"mb-14 avoid-break",children:[s("h3",{className:"display text-[19px] font-semibold leading-[1.25] mb-1",children:"A Walk Through Time: Ancient Calendars"}),s("div",{className:"text-[12px] tracking-[0.1em] uppercase opacity-60 mb-6",children:"NIST — Time and Frequency Division"}),w("div",{className:"prose text-[14.8px] leading-[1.72] space-y-4",children:[s("p",{className:"text-[12px] tracking-wide uppercase opacity-60",children:"Notice: Information accurate as of 2004."}),s("p",{children:"Celestial bodies — Sun, Moon, planets, stars — have provided reference for measuring passage of time. Ancient civilizations relied on apparent motion to determine seasons, months, years. Ice-age hunters in Europe over 20,000 years ago scratched lines and gouged holes in sticks and bones, possibly counting days between phases of moon. Five thousand years ago, Sumerians in Tigris-Euphrates had calendar that divided year into 30 day months, divided day into 12 periods (each 2 hours), divided these into 30 parts (each like 4 minutes). Stonehenge built over 4000 years ago, alignments show purposes included determination of seasonal or celestial events."}),s("p",{children:"Earliest Egyptian calendar based on moon's cycles, later Egyptians realized Dog Star Sirius rose next to sun every 365 days, about when annual inundation of Nile began. Devised 365 day calendar that seems to have begun around 3100 BCE, one of earliest years recorded."}),s("p",{children:"Before 2000 BCE, Babylonians used year of 12 alternating 29 day and 30 day lunar months, giving 354 day year. In contrast, Mayans of Central America relied not only on Sun and Moon, but also planet Venus, to establish 260 day and 365 day calendars. This culture spread between 2600 BCE and 1500 CE, apex 250–900 CE. They left records indicating belief that creation occurred in 3114 BCE. Their calendars later became portions of great Aztec calendar stones. Our present civilization has adopted 365 day solar calendar with leap year every fourth year (except century years not evenly divisible by 400)."})]}),w("div",{className:"mt-8 pt-4 border-t border-black/10 text-[11.5px] leading-[1.6]",children:[w("div",{children:[s("span",{className:"font-semibold",children:"Source Link:"})," ",s("a",{href:"https://www.nist.gov/pml/time-and-frequency-division/popular-links/walk-through-time/walk-through-time-ancient-calendars",target:"_blank",rel:"noopener",className:"underline",children:"A Walk Through Time - Ancient Calendars — NIST"})]}),s("div",{className:"italic opacity-70 mt-1",children:"Ties to: Chronology"})]})]}),s("hr",{className:"border-black/10 my-10 break-before"}),s("div",{className:"mb-2",children:s("h3",{className:"display text-[19px] font-semibold leading-[1.25] mb-1",children:"3. Dating the Undated"})}),w("section",{id:"sec3a",className:"mb-14",children:[s("div",{className:"text-[12px] tracking-[0.1em] uppercase opacity-60 mb-6",children:"Willard Libby and Radiocarbon Dating — American Chemical Society, National Historic Chemical Landmark"}),w("div",{className:"prose text-[14.8px] leading-[1.72] space-y-4",children:[s("blockquote",{className:"border-l-2 border-black pl-4 italic my-4",children:"“You read statements in books that such and such a society or archeological site is 20,000 years old. We learned rather abruptly that these numbers, these ancient ages, are not known accurately; in fact, it is at about the time of the First Dynasty in Egypt that the first historical date of any real certainty has been established.” —Willard Libby, Nobel Lecture, 12 Dec 1960"}),s("p",{children:"In 1946, Willard Libby proposed an innovative method for dating organic materials by measuring their content of carbon-14, a newly discovered radioactive isotope of carbon. Known as radiocarbon dating, this method provides objective age estimates for carbon-based objects that originated from living organisms. The radiocarbon revolution greatly benefited archaeology and geology by allowing more precise historical chronologies across geography and cultures."}),s("p",{children:"Willard Libby (1908–1980), professor of chemistry at University of Chicago, began research in 1945. Inspired by physicist Serge Korff who discovered neutrons were produced by cosmic rays. Korff predicted reaction between neutrons and nitrogen-14 would produce carbon-14. Libby calculated ratio of one carbon-14 atom per every 1 trillion carbon atoms on earth. He realized carbon-14 in atmosphere would find its way into living matter, tagging it. If one could detect amount of carbon-14 in object, one could establish its age using half-life."}),s("p",{children:"Carbon-14 first discovered in 1940 by Martin Kamen and Samuel Ruben using cyclotron at UC Berkeley. Half-life established as 5,568 years (later revised to 5,730 ±40)."}),s("p",{children:"Two factors needed for success: concentration of carbon-14 in atmosphere had been constant for thousands of years, and carbon-14 moved readily through atmosphere, biosphere, oceans in carbon cycle. Libby assumed cosmic radiation intensity constant (later proven generally true). He and graduate student Ernest Anderson calculated mixing across reservoirs."}),s("p",{children:"Detecting natural carbon-14 was challenge. Libby reached out to Aristid von Grosse who provided methane sample enriched in carbon-14 detectable by Geiger counter. Libby and Anderson established existence of naturally occurring carbon-14 matching Korff prediction."}),s("p",{children:"To prove concept, Libby's group developed anti-coincidence counter — sample chamber surrounded by Geiger counters calibrated to detect and eliminate background radiation, combined with thick shield and method to reduce samples to pure carbon. In 1949, Libby and Arnold published findings in Science, introducing “Curve of Knowns.” Graph compared known age of artifacts (from tree rings, Egyptian artifacts like funerary boat of Senusret III) with age as determined by radiocarbon dating. Agreement within small margin of error demonstrated accuracy."}),s("p",{children:"Concept relied on: once organism died, cut off from carbon cycle, time-capsule with steadily diminishing carbon-14 count. Living organisms have same carbon-14 as atmosphere; ancient sources like coal have none. Intermediate ages estimated by measuring remaining carbon-14."}),s("p",{children:"Testing used redwood and fir trees dated by annual rings, museum artifacts. Radiocarbon revolution: before, investigators relied on relative dating, comparing layers presuming chronological deposition. Radiocarbon provided first objective numerical dates for organic remains. Disproved notion civilization originated in Europe and diffused worldwide. Showed North American ice sheet receded 10,000–12,000 years ago, not 25,000."}),s("p",{children:"By 1960, 30+ labs worldwide. Awarded Nobel Prize in Chemistry 1960. Plaque at Kent Laboratory, University of Chicago, designated National Historic Chemical Landmark Oct 10 2016."})]}),w("div",{className:"mt-8 pt-4 border-t border-black/10 text-[11.5px] leading-[1.6] space-y-1",children:[w("div",{children:[s("span",{className:"font-semibold",children:"Source Links:"})," ",s("a",{href:"https://www.acs.org/content/dam/acsorg/education/whatischemistry/landmarks/willard-libby-radiocarbon-dating.pdf",target:"_blank",rel:"noopener",className:"underline",children:"ACS Landmark PDF"})," and ",s("a",{href:"https://www.acs.org/education/whatischemistry/landmarks/discovery-of-radiocarbon-dating.html",target:"_blank",rel:"noopener",className:"underline",children:"ACS Discovery of Radiocarbon Dating"})]}),s("div",{className:"italic opacity-70",children:"Ties to: Radiocarbon Dating, Archaeology"})]})]}),w("section",{id:"sec3b",className:"mb-14 break-before",children:[s("div",{className:"text-[12px] tracking-[0.1em] uppercase opacity-60 mb-6",children:"Carbon-14 Dating, Explained — University of Chicago News"}),w("div",{className:"prose text-[14.8px] leading-[1.72] space-y-5",children:[s("h4",{className:"font-semibold mt-2",children:"What is carbon-14 dating?"}),s("p",{children:"Radiocarbon dating is a method that can accurately determine the age of organic materials as old as ~60,000 years. First developed in the late 1940s at the University of Chicago by Willard Libby and his team, it revolutionized archaeology and continues to be central to dating the past."}),s("h4",{className:"font-semibold",children:"How does it work?"}),s("p",{children:"Cosmic rays from space bombard nitrogen atoms in the upper atmosphere, creating carbon-14. This carbon-14 mixes quickly through the atmosphere and into plants via photosynthesis and into animals that eat plants. While an organism is alive, it maintains the same ratio of carbon-14 to stable carbon-12 as the atmosphere. When it dies, absorption stops. The carbon-14 already inside begins to decay at a known rate (half-life ~5,730 years). By measuring how much carbon-14 remains compared to how much was originally there, scientists calculate time since death. Living organisms have atmospheric levels; ancient sources like coal have none."}),s("h4",{className:"font-semibold",children:"How was it invented?"}),s("p",{children:"Carbon-14 itself was first discovered in 1940 by Martin Kamen and Samuel Ruben at UC Berkeley using a cyclotron. At Chicago, Libby realized its dating potential. The challenge was detection — natural carbon-14 is vanishingly rare (about one per trillion carbon atoms). Libby and his team, including Ernest Anderson who tested latitude variation, purified samples to solid carbon and built low-background Geiger counters surrounded by anti-coincidence shielding to block cosmic radiation."}),s("p",{children:"In Physical Review in 1946, Libby proposed the method. By 1949, Libby and graduate student James Arnold published the Curve of Knowns — comparing tree-ring-dated wood, Egyptian funerary boat of Senusret III (Sesostris III), and other museum objects with their radiocarbon ages. Agreement proved the method. Collaborations with archaeologist Robert Braidwood tested early sites: a rope sandal from an Oregon cave, dung of an extinct ground sloth, linen wrapping of the Dead Sea Scrolls. By 1960, more than 30 labs existed worldwide. Libby received the Nobel Prize in Chemistry in 1960. A plaque in Kent Lab at UChicago was designated a National Historic Chemical Landmark in 2016."}),s("h4",{className:"font-semibold",children:"Limitations"}),s("p",{children:"It works only for organic (once-living) material and only up to about 60,000 years, after which too little carbon-14 remains. Conventional counting requires 10–100 grams of sample; newer accelerator mass spectrometry (AMS) needs only 20–50 milligrams but still destroys the material. Samples are easily contaminated: a million-year-old sample contaminated with a tiny amount of modern carbon can yield an apparent age of 40,000 years."}),s("p",{children:"Calibration is also needed because atmospheric carbon-14 has varied slightly over time. Dendrochronology — tree-ring dating — provides correction back 12,500 years with oak and 8,500 years with bristlecone pine. Beyond radiocarbon's range, scientists use other clocks: potassium-argon dating for rocks from less than 100,000 years to more than 4 billion years old, and rubidium-strontium dating for millions to billions of years."}),s("h4",{className:"font-semibold",children:"Has it improved?"}),s("p",{children:"Yes. Measurements are faster and more precise. AMS, developed in the late 1970s, counts atoms directly rather than waiting for decays, requiring far less material. Modern labs use Bayesian modeling — combining radiocarbon probabilities with stratigraphic information about sediment layers — to narrow date ranges, as noted by UChicago chemist David Mazziotti and colleagues like Hilde Levi who carried the method forward."}),s("h4",{className:"font-semibold",children:"What discoveries has it made possible?"}),s("p",{children:"As archaeologist Frederick Johnson said shortly after its invention, testing the effect of atomic bomb-produced radiocarbon showed “how inadequate the archaeological time-scale seemed.” R.E. Taylor in 1997 wrote that “a world prehistory was finally possible” because continents could be compared on a common chronology."}),w("ul",{className:"list-disc ml-5 space-y-1",children:[w("li",{children:[s("strong",{children:"Archaeology:"})," Correlation of the Mayan calendar with the European calendar, dating of Ötzi the Iceman to ~5,300 years ago, evidence that Australian Aboriginal arrival was >50,000 years ago, dating the Shroud of Turin to 1260–1390 CE, dating Zincirli, Turkey, to Middle Bronze Age contexts."]}),w("li",{children:[s("strong",{children:"Climate:"})," Proving North American ice sheets retreated ~11,000 years ago, not 25,000; tracking carbon movement through reservoirs; showing solar cycles and, crucially, proving modern fossil-fuel CO2 rise because fossil fuels contain no carbon-14 — their burning dilutes atmospheric carbon-14, a signature measured since the 1950s."]}),w("li",{children:[s("strong",{children:"Biomedicine:"})," Tracking Alzheimer plaques formed from bomb-testing carbon-14 spike of 1950s–60s, labeling drug candidates to study metabolism, testing cancer and toxicity pathways."]})]}),s("p",{className:"text-[12.5px] opacity-70 mt-4",children:"Written by Steve Koppes and Louise Lerner, University of Chicago News. Last reviewed Feb 2025."})]}),w("div",{className:"mt-8 pt-4 border-t border-black/10 text-[11.5px] leading-[1.6]",children:[w("div",{children:[s("span",{className:"font-semibold",children:"Source Link:"})," ",s("a",{href:"https://news.uchicago.edu/explainer/what-is-carbon-14-dating",target:"_blank",rel:"noopener",className:"underline",children:"What is Carbon Dating? — University of Chicago News"})]}),s("div",{className:"italic opacity-70 mt-1",children:"Ties to: Radiocarbon Dating"})]})]}),w("div",{id:"week2",className:"break-before pt-2",children:[s("div",{className:"text-[11px] tracking-[0.2em] uppercase font-semibold opacity-50 mb-2",children:"Week 2"}),s("h2",{className:"display text-[26px] leading-[1.1] font-semibold mb-8",children:"Geography & the Sweep of History"})]}),w("section",{id:"sec4a",className:"mb-14",children:[s("h3",{className:"display text-[19px] font-semibold leading-[1.25] mb-1",children:"Every Map Is a Choice"}),s("div",{className:"text-[12px] tracking-[0.1em] uppercase opacity-60 mb-6",children:"National Geographic Education — Investigating Map Projections"}),w("div",{className:"prose text-[14.8px] leading-[1.72] space-y-4",children:[s("p",{className:"text-[12.5px] uppercase tracking-wide opacity-60",children:"This lesson is part of Map Skills collection. Materials: 4–6 navel oranges, globes, markers, scissors, tape, internet, computer, projector, classroom, large-group instruction."}),w("p",{children:[s("strong",{children:"Overview:"})," Cartographers through ages developed maps for different purposes. In 16th century, Mercator developed world map mainly for ocean navigation, still used today but land masses distorted. No projection represents Earth precisely."]}),w("p",{children:[s("strong",{children:"Objectives:"})," investigate effect on surface changing 3D to 2D, recreate 3D from 2D, explain effects of different projections comparing with globe."]}),s("p",{children:s("strong",{children:"Directions:"})}),w("ol",{className:"list-decimal ml-5 space-y-2",children:[s("li",{children:"Demonstrate challenge transferring spherical surface to flat. Peel orange keeping peel one piece, place on overhead, discuss shapes. What happens when flattened? Show video The Cart
