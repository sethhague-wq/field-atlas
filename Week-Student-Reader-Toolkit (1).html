ren:[p("strong",{children:"Depend:"})," People depend on the environment — crops, timber, fish and fresh water from rivers and oceans."]}),w("li",{children:[p("strong",{children:"Adapt:"})," People adapt to the environment — wearing different clothing for climate, building shelters to fit weather."]}),w("li",{children:[p("strong",{children:"Modify:"})," People modify the environment — building dams, canals, roads, and mines, clearing forests for farms."]})]}),p("h3",{className:"font-display text-[19px] font-semibold mt-8 mb-2 !font-body tracking-tight",children:"4. Movement — How do people, goods, and ideas move?"}),p("p",{children:"Movement is the travel of people, products, and ideas. Humans move through travel, tourism, and immigration. Goods move via river, highway, railroad, and airplane. Ideas move via mail, telephone, television, and internet. Understanding movement helps you see why a culture in one place looks like a culture far away."}),p("h3",{className:"font-display text-[19px] font-semibold mt-8 mb-2 !font-body tracking-tight",children:"5. Region — How do we group places that have something in common?"}),p("p",{children:"A region is an area that shares one or more common features. Regions can be political — cities, states, counties, countries with boundaries. Regions can also be generalizations about what a place has in common. Examples: the Corn Belt in the Midwest, Chinatown in a major city, or the Sahara Desert. Regions help us compare and organize the world."}),w("div",{className:"mt-8 rounded-lg bg-stone-50 border border-stone-200 px-4 py-3",children:[p("div",{className:"font-body text-[11px] tracking-[0.15em] uppercase opacity-50 mb-1",children:"Key Vocabulary"}),w("p",{className:"font-body text-[13px] leading-[1.6] text-stone-700",children:[p("strong",{children:"Latitude:"})," Angular distance between the equator and a point north or south, measured along a meridian. Parallels run east-west."]}),w("p",{className:"font-body text-[13px] leading-[1.6] text-stone-700 mt-2",children:[p("strong",{children:"Longitude:"})," Angular distance east or west of the Prime Meridian (0° at Greenwich, England). Meridians run north-south and converge at the poles."]})]})]}),p("div",{className:"mt-6 font-body text-[11px] leading-[1.5] opacity-40 border-l border-stone-200 pl-3",children:"CRAAP Check — Currency: timeless NPS teaching standard • Relevance: all 5 themes match your 10 terms • Authority: NPS (U.S. Dept of Interior) • Accuracy: cross-checked with geography textbooks • Purpose: to teach students."})]}),w("section",{id:"sec2",className:"page-break pt-8 pb-12 border-t border-stone-200",children:[p("div",{className:"font-body text-[11px] tracking-[0.2em] uppercase opacity-50 mb-3",children:"Article 2 • Public Domain"}),p("h2",{className:"font-display text-[26px] font-semibold leading-[1.15] tracking-[-0.01em]",children:"What Is a Topographic Map? & What Does Map Scale Mean? — U.S. Geological Survey"}),w("div",{className:"font-body mt-2 text-[12px] leading-[1.5] opacity-70 break-all space-y-1",children:[w("div",{children:["Source: ",p("a",{href:"https://www.usgs.gov/publications/topographic-maps-tools-planning",target:"_blank",rel:"noreferrer",className:"underline underline-offset-4",children:"usgs.gov/publications/topographic-maps-tools-planning"})," • Public Domain"]}),w("div",{children:["Source: ",p("a",{href:"https://www.usgs.gov/faqs/what-does-map-scale-mean",target:"_blank",rel:"noreferrer",className:"underline underline-offset-4",children:"usgs.gov/faqs/what-does-map-scale-mean"})," • Public Domain"]})]}),w("div",{className:"prose prose-stone prose-p:font-body prose-p:text-[14.5px] prose-p:leading-[1.75] prose-p:text-stone-800 mt-6 max-w-none",children:[p("h3",{className:"font-display text-[19px] font-semibold mt-2 mb-2 !font-body tracking-tight",children:"What Is a Topographic Map?"}),p("p",{children:"Topographic maps are a detailed and accurate graphic record of a land area, giving the geographic positions and elevations for both natural and man-made features. They show the shape of the land — mountains, valleys, and plains — by means of brown contour lines."}),p("p",{children:"A contour line is a line of equal elevation above sea level. In steep areas, contour lines are closely spaced. In flat areas, they are far apart. You can estimate any elevation by referring to the elevations of the contour lines above and below your point."}),p("p",{children:"These are general-use maps at medium scales that present elevation with contour lines, hydrography (rivers, streams, lakes), geographic place names, and cultural features like roads, railroads, boundaries, and buildings."}),p("h3",{className:"font-display text-[19px] font-semibold mt-8 mb-2 !font-body tracking-tight",children:"Why are they called quadrangles?"}),p("p",{children:"Since 1947, the primary size of USGS topographic map has been the 7.5-minute quadrangle. It is bounded by two lines of latitude 7.5 minutes apart and two lines of longitude 7.5 minutes apart. “7.5-minute” refers to minutes of latitude and longitude, not time."}),p("p",{children:"These quadrangles are published at a scale of 1:24,000 — one inch on the map equals 24,000 inches, or 2,000 feet, on the ground. Each 7.5-minute quadrangle covers an area large enough to be useful but small enough to show detail. In Hawaii, for example, one quadrangle covers a small, detailed section of an island."}),p("h3",{className:"font-display text-[19px] font-semibold mt-8 mb-2 !font-body tracking-tight",children:"What Does Map Scale Mean?"}),p("p",{children:"To be most useful, a map must show locations and distances accurately on a sheet of paper of convenient size. That means everything must be shown proportionately smaller than it is in real life. The proportion chosen for a particular map is its scale."}),p("p",{children:"There are two scales commonly used on USGS maps:"}),w("ul",{className:"font-body text-[14.5px] leading-[1.7] list-disc pl-5 text-stone-800 space-y-1",children:[w("li",{children:[p("strong",{children:"Bar Scale (graphical):"})," A line marked with distances on the ground, like 0 — 1 mile — 2 miles. You can measure directly against it, and it remains true even if you enlarge or reduce the map on a copier."]}),w("li",{children:[p("strong",{children:"Fractional or Ratio Scale:"})," A fraction like 1:24,000 or 1:25,000. The units are the same on both sides. 1:24,000 means one inch on the map = 24,000 inches on the ground. The most used metric topographic scale is 1:25,000, where one centimeter = 0.25 kilometer, or one inch ≈ 0.4 mile."]})]}),p("p",{children:"Large-scale maps (like 1:24,000) show a small area with lots of detail. Small-scale maps (like 1:1,000,000) show a large area with less detail. Think: the larger the number after the colon, the smaller the scale and the less detail."})]}),p("div",{className:"mt-6 font-body text-[11px] leading-[1.5] opacity-40 border-l border-stone-200 pl-3",children:"CRAAP Check — Currency: USGS definitions are current standard since 1947, reviewed 2023 • Relevance: defines topographic map, contour line, map scale • Authority: USGS is federal science agency • Accuracy: standard reference • Purpose: public education on maps."})]}),w("section",{id:"sec3",className:"page-break pt-8 pb-12 border-t border-stone-200",children:[p("div",{className:"font-body text-[11px] tracking-[0.2em] uppercase opacity-50 mb-3",children:"Article 3 • Public Domain"}),p("h2",{className:"font-display text-[26px] font-semibold leading-[1.15] tracking-[-0.01em]",children:"Latitude, Longitude, Absolute and Relative Location — National Archives + NOAA"}),w("div",{className:"font-body mt-2 text-[12px] leading-[1.5] opacity-70 break-all",children:["Source: ",p("a",{href:"https://www.archives.gov/education/lessons/coordinates",target:"_blank",rel:"noreferrer",className:"underline underline-offset-4",children:"archives.gov/education/lessons/coordinates"})," • Public Domain (NARA / NOAA)"]}),w("div",{className:"prose prose-stone prose-p:font-body prose-p:text-[14.5px] prose-p:leading-[1.75] prose-p:text-stone-800 mt-6 max-w-none",children:[w("p",{children:[p("strong",{children:"Absolute Location"})," is the precise position of a place on the surface of the Earth. It is most often expressed as a coordinate pair: Latitude and Longitude. With GPS, we can determine absolute location within meters."]}),p("h3",{className:"font-display text-[19px] font-semibold mt-8 mb-2 !font-body tracking-tight",children:"Latitude"}),p("p",{children:"Latitude is the angular distance north or south of the equator, measured along a meridian. Lines of latitude are also called parallels because they are parallel to the equator and to each other. They range from 0° at the Equator to 90° North at the North Pole and 90° South at the South Pole. Latitude tells you how far north or south you are."}),p("h3",{className:"font-display text-[19px] font-semibold mt-8 mb-2 !font-body tracking-tight",children:"Longitude"}),p("p",{children:"Lines of longitude are also called meridians. Longitude is defined as the spherical angle east or west of Greenwich, England, which is the Prime Meridian at 0° longitude. Values increase from 0° to 180° East and 0° to 180° West. Unlike parallels, meridians are not parallel — they converge at the North and South Poles. Longitude tells you how far east or west you are."}),p("h3",{className:"font-display text-[19px] font-semibold mt-8 mb-2 !font-body tracking-tight",children:"The Grid System"}),p("p",{children:"Together, latitude and longitude form a grid. When you write a coordinate, latitude always comes first, then longitude. Example: Philadelphia is about 40° N, 75° W. The first number is how far north of the equator, the second is how far west of Greenwich."}),p("h3",{className:"font-display text-[19px] font-semibold mt-8 mb-2 !font-body tracking-tight",children:"Relative Location — Position Compared to Other Places"}),p("p",{children:"Relative location is the position of a place in relation to other places people know. Examples: “Oklahoma is north of Texas.” “Princeville is on the north shore of Kauai, northwest of Lihue.” Relative location is useful for giving directions and for understanding connections."}),p("p",{children:"Key difference: Absolute location does not change. Relative location changes depending on who is describing it and what reference points they use. A historian chooses which reference makes the most sense for the story they are telling."}),w("div",{className:"mt-8 rounded-lg bg-stone-50 border border-stone-200 px-4 py-3 font-body text-[13px] leading-[1.6] text-stone-700",children:[p("strong",{children:"Quick check for your 10 terms:"})," Absolute location = exact coordinates (40°N, 75°W). Relative location = “north of…”, “next to…”. Latitude = distance north/south of equator. Longitude = distance east/west of Prime Meridian."]})]}),p("div",{className:"mt-6 font-body text-[11px] leading-[1.5] opacity-40 border-l border-stone-200 pl-3",children:"CRAAP Check — Currency: timeless coordinate system, NARA lesson updated 2022 • Relevance: defines absolute/relative location, latitude, longitude • Authority: NARA & NOAA • Accuracy: standard geographic coordinate system • Purpose: teach map literacy."})]}),w("section",{id:"sec4",className:"page-break pt-8 pb-12 border-t border-stone-200",children:[p("div",{className:"font-body text-[11px] tracking-[0.2em] uppercase opacity-50 mb-3",children:"Article 4 • CC BY 4.0"}),p("h2",{className:"font-display text-[26px] font-semibold leading-[1.15] tracking-[-0.01em]",children:"Every Map Is a Choice — How Maps Show Power — OpenStax World History Volume 1"}),w("div",{className:"font-body mt-2 text-[12px] leading-[1.5] opacity-70 break-all space-y-1",children:[w("div",{children:["Source: ",p("a",{href:"https://openstax.org/books/world-history-volume-1/pages/1-1-developing-a-global-perspective",target:"_blank",rel:"noreferrer",className:"underline underline-offset-4",children:"openstax.org/books/world-history-volume-1/pages/1-1-developing-a-global-perspective"})," • CC BY 4.0"]}),w("div",{children:["License: Access for free at ",p("a",{href:"https://openstax.org/books/world-history-volume-1/pages/1-introduction",target:"_blank",rel:"noreferrer",className:"underline underline-offset-4",children:"openstax.org/books/world-history-volume-1"})," — OpenStax, Rice University"]})]}),w("div",{className:"prose prose-stone prose-p:font-body prose-p:text-[14.5px] prose-p:leading-[1.75] prose-p:text-stone-800 mt-6 max-w-none",children:[p("p",{className:"italic text-stone-600",children:"Figure 1.1 The Whole World — a seventeenth-century projection map by Philip Eckebrecht for Johannes Kepler — gives us a sense of the breadth of territory that early modern Europeans thought they knew. Maps like this often reflect the maker's perception of geographical realities, not just the realities themselves."}),p("p",{children:"The study of world history requires a strong understanding of geography. You might assume maps are fairly cut and dried — a neutral picture of the world. For most of history, that is not the case."}),p("p",{children:"Maps are some of the most contested pieces of historical evidence because they are almost always made from the perspective of the one making the map, not from an objective view. Most civilizations put themselves at the center of the known world. That is human nature — and it affects what gets included, what gets left out, and what gets made bigger."}),p("h3",{className:"font-display text-[19px] font-semibold mt-8 mb-2 !font-body tracking-tight",children:"Maps as Tools of Power"}),p("p",{children:"Maps have been used to aid conquest and suppression. During the Age of Exploration, the Pope arbitrarily divided the inhabited territory new to Europeans and granted it to Spain and Portugal — drawing lines on a map where no European had yet traveled. Centuries later, in Berlin, Germany, in 1884-1885, European diplomats drew lines on a map of Africa to apportion territory among colonial powers, with no Africans present."}),p("p",{children:"Think: how might written history change if the surviving maps were of Indigenous origin? What would be at the center? What names would places have?"}),p("h3",{className:"font-display text-[19px] font-semibold mt-8 mb-2 !font-body tracking-tight",children:"The Size Lie"}),p("p",{children:"Even when humanity acquired accurate knowledge about the size of Earth and the space its continents occupied, maps remained inaccurate — often showing Europe as larger than it is, and regions of the Global South — Latin America, Africa, parts of Asia, Oceania — as smaller than they really are. This matters because size on a map feels like importance."}),p("h3",{className:"font-display text-[19px] font-semibold mt-8 mb-2 !font-body tracking-tight",children:"Maps Present Challenges Today"}),p("p",{children:"Territories are still claimed by more than one entity. For example, Crimea is claimed by both Russia and Ukraine. Taiwan claims independence while China considers it part of China. A mapmaker has to choose which claim to show — and that choice is political."}),p("h3",{className:"font-display text-[19px] font-semibold mt-8 mb-2 !font-body tracking-tight",children:"Bridging to Modern: Cartography and Projection Bias"}),p("p",{children:"Cartography is the science and practice of making maps. Because Earth is a sphere (actually an oblate spheroid), you cannot flatten it without distortion. Every flat map has to choose what to preserve and what to distort."}),w("ul",{className:"font-body text-[14.5px] leading-[1.7] list-disc pl-5 text-stone-800 space-y-1",children:[w("li",{children:[p("strong",{children:"Mercator (1569):"})," Preserves direction and shape locally — great for navigation — but distorts size badly. Greenland looks larger than Africa, when Africa is 14 times larger."]}),w("li",{children:[p("strong",{children:"Robinson, Mollweide, Winkel Tripel:"})," Different tradeoffs — each tries to balance area, shape, distance, and direction, but none is perfect."]})]}),p("p",{children:"This tradeoff is called Map Projection Bias. There is no “correct” projection, only projections that serve different purposes. When you see a world map in a textbook, ask: what did this projection preserve, and what did it sacrifice? And who benefits from that choice?"})]}),p("div",{className:"mt-6 font-body text-[11px] leading-[1.5] opacity-40 border-l border-stone-200 pl-3",children:"CRAAP Check — Currency: OpenStax World History 2022 edition • Relevance: links maps, power, projection bias to Week 2 • Authority: OpenStax / Rice University peer-reviewed • Accuracy: cited by college history programs • Purpose: teach global perspective."})]}),w("section",{id:"sec5",className:"page-break pt-8 pb-16 border-t border-stone-200",children:[p("div",{className:"font-body text-[11px] tracking-[0.2em] uppercase opacity-50 mb-3",children:"Article 5 • CC BY 4.0"}),p("h2",{className:"font-display text-[26px] font-semibold leading-[1.15] tracking-[-0.01em]",children:"How People, Ideas, and Land Shape Each Other — Cultural Diffusion & Human-Environment Interaction — OER Introduction to Cultural Geography"}),w("div",{className:"font-body mt-2 text-[12px] leading-[1.5] opacity-70 break-all",children:["Source: ",p("a",{href:"https://pressbooks.nvcc.edu/",target:"_blank",rel:"noreferrer",className:"underline underline-offset-4",children:"pressbooks.nvcc.edu — Introduction to Cultural Geography (OER)"})," • CC BY 4.0"]}),w("div",{className:"prose prose-stone prose-p:font-body prose-p:text-[14.5px] prose-p:leading-[1.75] prose-p:text-stone-800 mt-6 max-w-none",children:[p("h3",{className:"font-display text-[19px] font-semibold mt-2 mb-2 !font-body tracking-tight",children:"Human-Environment Interaction — How Have People Changed Place, and How Does Environment Affect People?"}),p("p",{children:"Human-Environment Interaction answers two questions: How have people changed a place, and how does the environment affect people? There are three aspects:"}),w("ul",{className:"font-body text-[14.5px] leading-[1.7] list-disc pl-5 text-stone-800 space-y-1",children:[w("li",{children:[p("strong",{children:"Depend:"})," People depend on environment for water, food, materials."]}),w("li",{children:[p("strong",{children:"Adapt:"})," People adapt to climate, topography, hazards — irrigation in deserts, stilt houses in floodplains."]}),w("li",{children:[p("strong",{children:"Modify:"})," People modify environment — clearing land for agriculture, damming streams to store and divert water."]})]}),p("p",{children:"For thousands of years, humans have modified the physical environment by clearing land for agriculture and damming streams to store and divert water. As we industrialized, we built factories and power plants. While these modifications directly impact the local area, they also impact areas farther away due to the interconnectivity of Earth’s systems — smoke drifts, rivers carry sediment, roads redirect trade."}),p("h3",{className:"font-display text-[19px] font-semibold mt-8 mb-2 !font-body tracking-tight",children:"Cultural Diffusion — How Ideas Spread"}),p("p",{children:"Cultural diffusion is the spread of cultural traits from one place to another. The hearth is the place where an innovation originates. The spread across space and time is termed diffusion."}),p("p",{className:"font-semibold text-[14.5px] mt-6",children:"Two main types:"}),w("ol",{className:"font-body text-[14.5px] leading-[1.7] list-decimal pl-5 text-stone-800 space-y-2",children:[w("li",{children:[p("strong",{children:"Relocation Diffusion:"})," The spread through actual movement of people — migration — who take their cultural baggage with them. Example: colonists bringing farming practices to a new continent."]}),w("li",{children:[p("strong",{children:"Expansion Diffusion:"})," Spreads outward but remains strong at the origin. Three subtypes:",w("ul",{className:"list-disc pl-5 mt-2 space-y-1",children:[w("li",{children:[p("strong",{children:"Contagious:"})," Rapid, direct contact — nearly everyone adopts. Example: Islam in its early centuries spreading rapidly across the Middle East and North Africa."]}),w("li",{children:[p("strong",{children:"Hierarchical:"})," Spreads from larger, more influential areas to smaller ones. Example: fashion trends from New York to smaller towns."]}),w("li",{children:[p("strong",{children:"Stimulus:"})," Idea is modified for cultural reasons when adopted. Example: McDonald’s in India serves no beef, adapting to Hindu cultural practices."]})]})]})]}),p("h3",{className:"font-display text-[19px] font-semibold mt-8 mb-2 !font-body tracking-tight",children:"From Past to Modern — Examples You Can Trace"}),w("ul",{className:"font-body text-[14.5px] leading-[1.7] list-disc pl-5 text-stone-800 space-y-2",children:[w("li",{children:[p("strong",{children:"Buddhism:"})," Origin hearth in India, diffused to East Asia via merchants and missionaries — hierarchical and contagious along Silk Roads."]}),w("li",{children:[p("strong",{children:"Islam:"})," Spread to West Africa and Southeast Asia via trade routes — relocation by traders and expansion by conversion."]}),w("li",{children:[p("strong",{children:"Champa rice:"})," Fast-ripening rice from Vietnam (Champa) introduced to Song China in the 11th century — a past food-security innovation linking to modern agricultural diffusion and food systems."]}),w("li",{children:[p("strong",{children:"Black Death:"})," Spread along Mongol trade networks in the 14th century — past pandemics to modern lesson on how connectivity moves both goods and disease."]})]}),p("h3",{className:"font-display text-[19px] font-semibold mt-8 mb-2 !font-body tracking-tight",children:"Region — Three Ways Geographers Group the World"}),w("ul",{className:"font-body text-[14.5px] leading-[1.7] list-disc pl-5 text-stone-800 space-y-1",children:[w("li",{children:[p("strong",{children:"Formal Region:"})," Shared characteristics — language, climate, crop. Example: Corn Belt, Sahara Desert."]}),w("li",{children:[p("strong",{children:"Functional Region:"})," Organized around a central point or node. Example: a city and its suburbs linked by commuting, or a newspaper circulation area."]}),w("li",{children:[p("strong",{children:"Vernacular (Perceptual) Region:"})," Based on people’s perception and feeling. Example: “The South,” “Chinatown.” Not official, but real in how people think."]})]}),p("h3",{className:"font-display text-[19px] font-semibold mt-8 mb-2 !font-body tracking-tight",children:"Closing: Why Geography Matters for History"}),p("p",{children:"Topography matters: the Himalayas limited diffusion between South Asia and Tibet, acting as a barrier. Relative location matters: Constantinople sat at the crossroads of Europe and Asia, enabling diffusion — ideas, goods, and faiths had to pass through it. When you study history, always ask: What does the land allow, what does it block, and who is located to take advantage of it?"})]}),p("div",{className:"mt-6 font-body text-[11px] leading-[1.5] opacity-40 border-l border-stone-200 pl-3",children:"CRAAP Check — Currency: OER cultural geography editions 2020-2023 • Relevance: covers cultural diffusion, hearth, relocation/expansion/contagious/hierarchical/stimulus, human-environment (depend/adapt/modify), formal/functional/vernacular region • Authority: community-college geography faculty OER • Accuracy: matches OpenStax / NGS definitions • Purpose: teach."})]}),w("footer",{className:"border-t border-stone-200 pt-8 mt-2",children:[p("div",{className:"font-body text-[11px] tracking-[0.15em] uppercase opacity-50 mb-2",children:"Attribution"}),p("p",{className:"font-body text-[12px] leading-[1.6] text-stone-600",children:"Attribution: NPS / USGS / NOAA / NARA materials are Public Domain (U.S. Government). OpenStax World History Volume 1 is CC BY 4.0 — Access for free at openstax.org. OER Introduction to Cultural Geography via pressbooks.nvcc.edu is
